<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5efdf">
  <meta name="description" content="Line &amp; Lode is a single-player mining roguelite about tuning your reel, managing chain strain, and hauling value from risky claims beneath Rustwater.">
  <title>Line &amp; Lode</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23362f26'/%3E%3Cpath d='M12 38 20 20 40 14 53 34 43 49 24 51Z' fill='%23f4ba43'/%3E%3Cpath d='M20 20 40 14 32 34 12 38Z' fill='%23ffe18b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="platform.css"><script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script><script src="crazygames-platform.js"></script><script src="platform-config.js"></script><script src="platform-adapter.js"></script><link rel="stylesheet" href="crazygames.css"><link rel="stylesheet" href="first-catch.css"></head>
<body>
  <main class="app">
    <header class="masthead">
      <a class="brand" href="./index.html" aria-label="Line &amp; Lode home"><span class="brand-mark" aria-hidden="true">◆</span><span>LINE &amp; LODE<span class="brand-dot">.</span></span></a>
      <nav aria-label="Game options"><button id="menu-toggle" class="quiet" aria-haspopup="dialog" aria-expanded="false">Menu <span aria-hidden="true">≡</span></button><button id="fullscreen" class="icon-button" aria-label="Enter fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3V8M16 3H21V8M3 16V21H8M21 16V21H16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button id="pause" class="icon-button" aria-label="Pause game" title="Pause (P / Esc)" disabled>Ⅱ</button></nav>
    </header>
    <section class="game-shell" aria-label="Line &amp; Lode mining game">
      <div class="hud">
        <div class="claim-stat"><span class="claim-code" title="Region / claim"><span id="region">01</span>.<span id="claim">01</span></span><span id="location">Rustwater Reach</span></div>
        <div class="haul-stat"><div class="stat-line"><span class="sr-only" id="goal-label">Claim target</span><span><strong id="earned">$0</strong><span class="of"> / <span id="goal">$650</span></span></span></div><div class="progress" role="progressbar" aria-label="Claim target" aria-valuemin="0" aria-valuemax="650" aria-valuenow="0"><div id="progress-fill"></div></div></div>
        <div class="time-stat" aria-label="Time remaining"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 5V10L13 12"/></svg><strong id="time">6:00</strong></div>
      </div>
      <aside id="first-catch" class="first-catch" hidden><div><strong id="first-catch-title"></strong><p id="first-catch-text" role="status"></p></div><button id="skip-first-catch" type="button">Skip tips</button></aside>
      <div class="stage" id="stage">
        <canvas id="mine" width="1200" height="680" tabindex="0" role="img" aria-label="Mine with ore and surprise catches. Space drops the claw. Left and Right adjust reel force. Watch chain strain when hauling."></canvas>
        <div id="find-effect" class="find-effect" hidden aria-live="off"></div>
        <div id="mine-warning" class="mine-warning" hidden></div>
        <div id="haul-coach" class="haul-coach" hidden><strong id="latch-title"></strong><span id="latch-advice"></span><div class="latch-progress"><i id="latch-progress"></i></div></div>
        <div id="toast" class="toast" role="status"></div>
        <div id="overlay" class="overlay"><section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1"></section></div>
      </div>
      <div class="controls">
        <div class="reel-control">
          <div class="reel-heading"><label for="reel-force">PULL <output id="force-value">50%</output></label><span class="load-tag" id="load-tag" hidden></span><span id="reel-state"></span></div>
          <div class="reel-slider-row"><div class="force-track"><input id="reel-force" type="range" min="0" max="100" step="5" value="50" aria-describedby="reel-advice" title="Softer ← · → Harder"><i id="latch-band" hidden></i><i id="safe-marker" title="Safe force for this load"></i></div></div>
          <div class="strain-row idle"><span>CHAIN</span><div class="strain-meter" role="progressbar" aria-label="Chain strain" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="strain-fill"></i></div><strong id="strain-value">0%</strong></div>
          <div id="reel-advice" class="sr-only">Left and Right adjust force. Softer is slower. Ease off when strain builds.</div>
        </div>
        <div class="action-buttons"><button id="next-pocket" class="pocket-button" disabled title="Next pocket: leave remaining finds. Costs 2.5 seconds. (N)"><span aria-hidden="true">↓</span><span id="pocket-count">1 / 8</span></button><button id="blast" class="blast" hidden disabled><span class="dynamite-icon" aria-hidden="true">▰</span><span id="dynamite">1</span></button><button id="drop" class="primary drop" disabled><span id="drop-label">Drop claw</span><kbd>SPACE</kbd><span class="button-arrow" aria-hidden="true">↓</span></button></div>
      </div>
    </section>
  </main>
  <noscript>This game needs JavaScript enabled.</noscript>
  <input id="import-save" type="file" accept="application/json,.json" hidden aria-label="Import campaign save">
  
  
  
  
  
  
<div id="pg-loading"><p>Preparing Line & Lode…</p></div><script src="first-catch.js"></script><script src="platform-loader.js"></script></body>
</html>
